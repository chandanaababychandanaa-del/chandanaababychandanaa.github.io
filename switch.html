<!DOCTYPE html>
<html>
    <head>
        <title>JS learning</title>
    </head>
    <body>
        <h1>SWITCH STATEMENT</h1>
        <div id="output"></div>
        <script>
            let day =3;
            switch(day){
                case 1:document.getElementById("output").innerHTML="SUNDAY";
                break;
                case 2:document.getElementById("output").innerHTML="MONADAY";
                break;
                case 3:document.getElementById("output").innerHTML="TUESDAY";
                break;
                case 4:document.getElementById("output").innerHTML="WEDNESDAY";
                break;
                case 5:document.getElementById("output").innerHTML="THURSADY";
                break;
                case 6:document.getElementById("output").innerHTML="FRIDAY";
                break;
                case 7:document.getElementById("output").innerHTML="SATURDAY";
                break;
                default:
                    document.getElementById("output").innerHTML="invalidday";
                    

            }
        </script>
    </body>
</html>
