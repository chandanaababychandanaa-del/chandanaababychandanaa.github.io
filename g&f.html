<!DOCTYPE html>
<html>
<head>
    <title>signal System</title>
</head>
<body>
    <script>
        let grade = "B";

// Convert grade to uppercase
grade = grade.toUpperCase();

switch (grade) {
    case "A+":
        console.log("Outstanding");
        break;

    case "A":
        console.log("Excellent");
        break;

    case "B":
        console.log("Very Good");
        break;

    case "C":
        console.log("Good");
        break;

    case "D":
        console.log("Needs Improvement");
        break;

    case "F":
        console.log("Fail");
        break;

    default:
        console.log("Invalid Grade");
}
</script>
</body>
</html>
