<!DOCTYPE html>
<html>
<head>
    <title>Calculator Using Switch</title>
</head>
<body>

    <h2>Calculator Using Switch</h2>

    <script>
        let a = 20;
        let b = 5;
        let operator = "*";
        let result;

        switch (operator) {
            case "+":
                result = a + b;
                break;

            case "-":
                result = a - b;
                break;

            case "*":
                result = a * b;
                break;

            case "/":
                if (b === 0) {
                    result = "Cannot divide by zero";
                } else {
                    result = a / b;
                }
                break;

            case "%":
                if (b === 0) {
                    result = "Cannot find remainder with zero";
                } else {
                    result = a % b;
                }
                break;

            default:
                result = "Invalid operator";
        }

        document.write(a + " " + operator + " " + b + " = " + result);
    </script>

</body>
</html>
<!DOCTYPE html>
<html>
<head>
    <title>Restaurant Ordering System</title>
</head>
<body>

<script>
    let choice = 3;
    let quantity = 2;

    switch (choice) {
        case 1:
            let pizzaPrice = 250;
            console.log("Pizza - ₹250");
            console.log("Quantity: " + quantity);
            console.log("Total Bill: ₹" + (pizzaPrice * quantity));
            break;

        case 2:
            let burgerPrice = 150;
            console.log("Burger - ₹150");
            console.log("Quantity: " + quantity);
            console.log("Total Bill: ₹" + (burgerPrice * quantity));
            break;

        case 3:
            let pastaPrice = 200;
            console.log("Pasta - ₹200");
            console.log("Quantity: " + quantity);
            console.log("Total Bill: ₹" + (pastaPrice * quantity));
            break;

        case 4:
            let sandwichPrice = 120;
            console.log("Sandwich - ₹120");
            console.log("Quantity: " + quantity);
            console.log("Total Bill: ₹" + (sandwichPrice * quantity));
            break;

        case 5:
            console.log("Thank you for visiting");
            break;

        default:
            console.log("Invalid menu option");
    }
</script>

</body>
</html>
