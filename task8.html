<!DOCTYPE html>
<html>
<head>
    <title>signal System</title>
</head>
<body>
    <script>
    let menu = 3;
let marks = 78;
let attendance = 82;

switch (menu) {
    case 1:
        console.log("Student Details");
        console.log("Marks:", marks);
        console.log("Attendance:", attendance + "%");
        break;

    case 2:
        console.log("Attendance Status");
        if (attendance >= 75) {
            console.log("Eligible");
        } else {
            console.log("Not Eligible");
        }
        break;

    case 3:
        console.log("Result");
        console.log("Marks:", marks);

        if (marks >= 90) {
            console.log("Grade: A+");
            console.log("Pass");
        } else if (marks >= 80) {
            console.log("Grade: A");
            console.log("Pass");
        } else if (marks >= 70) {
            console.log("Grade: B");
            console.log("Pass");
        } else if (marks >= 60) {
            console.log("Grade: C");
            console.log("Pass");
        } else if (marks >= 50) {
            console.log("Grade: D");
            console.log("Pass");
        } else {
            console.log("Grade: F");
            console.log("Fail");
        }
        break;

    case 4:
        console.log("Thank you for using the Student Portal");
        break;

    default:
        console.log("Invalid menu option");
}
</script>
</body>
</html>
