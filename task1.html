<!DOCTYPE html>
<html>
<head>
    <title>signal System</title>
</head>
<body>
    <script>
        let day = 5;

switch (day) {
    case 1:
        console.log("Monday — Work Day");
        break;

    case 2:
        console.log("Tuesday — Work Day");
        break;

    case 3:
        console.log("Wednesday — Work Day");
        break;

    case 4:
        console.log("Thursday — Work Day");
        break;

    case 5:
        console.log("Friday — Work Day");
        break;

    case 6:
        console.log("Saturday — Weekend");
        break;

    case 7:
        console.log("Sunday — Weekend");
        break;

    default:
        console.log("Invalid day");
}
</script>
</body>
</html>
