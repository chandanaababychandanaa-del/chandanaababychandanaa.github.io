<!DOCTYPE html>
<html>
<head>
    

<script>

let signal = "yellow";

switch (signal.toLowerCase()) {
    case "red":
        console.log("Stop");
        break;

    case "yellow":
        console.log("Ready / Slow Down");
        break;

    case "green":
        console.log("Go");
        break;

    default:
        console.log("Invalid Signal");
}

</script>
</body>
</html>
